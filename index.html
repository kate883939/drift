<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>drift · 飄</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --deep:    #0a1f33;
    --ocean:   #143b5e;
    --mid:     #2a6a8f;
    --mist:    #6fa3bf;
    --foam:    #cfe4ee;
    --light:   #eaf3f7;
    --ink:     #f4f7f9;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    font-family: 'PingFang TC', 'Songti TC', 'Times New Roman', serif;
    color: var(--ink);
    background: linear-gradient(180deg,
      var(--deep) 0%,
      var(--ocean) 40%,
      var(--mid) 75%,
      var(--mist) 100%);
    position: relative;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  canvas#sea {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  .mist {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 20% 60%, rgba(207,228,238,0.08), transparent 50%),
      radial-gradient(ellipse at 80% 70%, rgba(207,228,238,0.06), transparent 50%);
    animation: mistDrift 30s ease-in-out infinite alternate;
  }
  @keyframes mistDrift {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-20px, 10px) scale(1.05); }
  }

  /* Topbar */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 18px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    pointer-events: none;
  }
  .topbar > * { pointer-events: auto; }
  .brand {
    font-family: 'Times New Roman', 'PingFang TC', 'Songti TC', serif;
    font-size: 24px;
    letter-spacing: 0.25em;
    font-style: italic;
    font-weight: 300;
    color: var(--foam);
    opacity: 0.85;
  }
  .topbar-actions { display: flex; gap: 10px; }

  .icon-btn {
    background: rgba(234,243,247,0.06);
    border: 1px solid rgba(234,243,247,0.2);
    color: var(--foam);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: all 0.4s ease;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    -webkit-tap-highlight-color: rgba(234,243,247,0.3);
    touch-action: manipulation;
    padding: 0;
    position: relative;
    z-index: 101;
  }
  .icon-btn:hover, .icon-btn.active {
    background: rgba(234,243,247,0.14);
    border-color: rgba(234,243,247,0.5);
  }
  .icon-btn svg {
    width: 16px; height: 16px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Main stage */
  .stage {
    position: relative;
    z-index: 10;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 28px 130px;
  }

  .greeting {
    font-family: 'Times New Roman', 'PingFang TC', 'Songti TC', serif;
    font-style: italic;
    font-size: 14px;
    letter-spacing: 0.2em;
    color: var(--foam);
    opacity: 0.5;
    margin-bottom: 10px;
    text-align: center;
    min-height: 18px;
  }

  .prompt {
    font-family: -apple-system, 'PingFang TC', 'Helvetica Neue', sans-serif;
    font-weight: 300;
    color: var(--foam);
    opacity: 0.6;
    font-size: 16px;
    letter-spacing: 0.15em;
    margin-bottom: 28px;
    text-align: center;
    transition: opacity 0.6s ease;
  }
  [data-lang="en"] .prompt {
    font-family: 'Times New Roman', 'PingFang TC', 'Songti TC', serif;
    font-style: italic;
    font-size: 19px;
    letter-spacing: 0.06em;
  }

  .compose {
    width: 100%;
    max-width: 520px;
    position: relative;
  }

  textarea.input {
    width: 100%;
    min-height: 150px;
    background: rgba(10, 31, 51, 0.28);
    border: 1px solid rgba(207, 228, 238, 0.18);
    border-radius: 20px;
    color: var(--ink);
    font-family: 'PingFang TC', 'Songti TC', 'Times New Roman', serif;
    font-size: 18px;
    line-height: 1.9;
    padding: 24px 26px;
    resize: none;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    outline: none;
    transition: all 0.5s ease;
    letter-spacing: 0.02em;
  }
  textarea.input::placeholder {
    color: rgba(207, 228, 238, 0.45);
    font-family: -apple-system, 'PingFang TC', 'Helvetica Neue', sans-serif;
    font-weight: 300;
    font-style: normal;
    letter-spacing: 0.05em;
  }
  [data-lang="en"] textarea.input::placeholder {
    font-family: 'Times New Roman', 'PingFang TC', 'Songti TC', serif;
    font-style: italic;
    font-size: 19px;
    letter-spacing: 0.02em;
  }
  textarea.input:focus {
    border-color: rgba(207, 228, 238, 0.4);
    background: rgba(10, 31, 51, 0.4);
  }

  .actions {
    margin-top: 22px;
    display: flex;
    gap: 14px;
    justify-content: center;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.5s ease, transform 0.5s ease;
    pointer-events: none;
  }
  .actions.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .compose.has-text .actions,
  textarea.input:not(:placeholder-shown) + .actions {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .btn {
    font-family: -apple-system, 'PingFang TC', 'Helvetica Neue', sans-serif;
    font-size: 15px;
    letter-spacing: 0.35em;
    text-indent: 0.35em;
    background: rgba(207, 228, 238, 0.04);
    border: 1px solid rgba(207, 228, 238, 0.3);
    color: var(--foam);
    padding: 14px 32px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.4s ease;
    font-weight: 300;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    line-height: 1.2;
  }
  .btn .sub {
    font-family: 'Times New Roman', 'PingFang TC', 'Songti TC', serif;
    font-style: italic;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-indent: 0.2em;
    opacity: 0.55;
    font-weight: 400;
  }
  [data-lang="en"] .btn {
    font-family: 'Times New Roman', 'PingFang TC', 'Songti TC', serif;
    font-style: italic;
    font-size: 17px;
    letter-spacing: 0.2em;
    text-indent: 0.2em;
  }
  [data-lang="en"] .btn .sub { display: none; }
  .btn:hover {
    background: rgba(207, 228, 238, 0.1);
    border-color: rgba(207, 228, 238, 0.6);
  }
  .btn.primary {
    background: rgba(207, 228, 238, 0.12);
    border-color: rgba(207, 228, 238, 0.5);
  }
  .btn.primary:hover {
    background: rgba(207, 228, 238, 0.2);
    border-color: rgba(207, 228, 238, 0.75);
  }

  .drifting {
    position: fixed;
    z-index: 15;
    pointer-events: none;
    font-family: 'PingFang TC', 'Songti TC', 'Times New Roman', serif;
    font-size: 18px;
    line-height: 1.7;
    color: var(--ink);
    max-width: 480px;
    padding: 22px 24px;
    text-align: center;
    letter-spacing: 0.04em;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* Floating lights */
  .lights-layer {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
  }
  .light {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--foam);
    box-shadow:
      0 0 8px var(--foam),
      0 0 18px rgba(207, 228, 238, 0.7),
      0 0 32px rgba(207, 228, 238, 0.35);
    cursor: pointer;
    pointer-events: auto;
    transition: box-shadow 0.3s ease;
    will-change: transform;
    transform: translate(-50%, -50%);
  }
  .light:hover {
    box-shadow:
      0 0 12px var(--foam),
      0 0 26px rgba(207, 228, 238, 0.9),
      0 0 48px rgba(207, 228, 238, 0.55);
  }
  .light.new {
    animation: lightBirth 1.4s ease-out;
  }
  @keyframes lightBirth {
    0%   { opacity: 0; }
    30%  { opacity: 1; box-shadow: 0 0 20px var(--foam), 0 0 60px rgba(207,228,238,0.9); }
    100% { opacity: 1; }
  }

  /* Archive toggle - solid light pill */
  .archive-toggle {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    font-family: -apple-system, 'PingFang TC', 'Helvetica Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    color: var(--deep);
    cursor: pointer;
    background: var(--foam);
    border: 1px solid var(--foam);
    padding: 12px 26px;
    border-radius: 999px;
    transition: all 0.4s ease;
    font-weight: 400;
    box-shadow: 0 4px 20px rgba(10, 31, 51, 0.3);
  }
  [data-lang="en"] .archive-toggle {
    font-family: 'Times New Roman', 'PingFang TC', 'Songti TC', serif;
    font-style: italic;
    font-size: 15px;
    letter-spacing: 0.2em;
  }
  .archive-toggle:hover {
    background: var(--light);
    box-shadow: 0 6px 26px rgba(10, 31, 51, 0.4);
  }
  .archive-toggle .count {
    margin-left: 6px;
    font-size: 11px;
    opacity: 0.55;
  }

  /* Panels */
  .panel {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(10, 31, 51, 0.9);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
    overflow-y: auto;
    padding: 70px 24px 60px;
  }
  .panel.open {
    opacity: 1;
    pointer-events: auto;
  }
  .panel-inner { max-width: 560px; margin: 0 auto; }
  .panel-title {
    font-family: 'Times New Roman', 'PingFang TC', 'Songti TC', serif;
    font-style: italic;
    font-size: 32px;
    color: var(--foam);
    margin-bottom: 6px;
    letter-spacing: 0.06em;
  }
  .panel-sub {
    font-family: -apple-system, 'PingFang TC', 'Helvetica Neue', sans-serif;
    font-size: 13px;
    color: rgba(207, 228, 238, 0.55);
    letter-spacing: 0.15em;
    margin-bottom: 40px;
    font-weight: 300;
  }
  [data-lang="en"] .panel-sub {
    font-family: 'Times New Roman', 'PingFang TC', 'Songti TC', serif;
    font-style: italic;
    font-size: 15px;
    letter-spacing: 0.05em;
  }
  .panel-close {
    position: fixed;
    top: 18px;
    left: 22px;
    z-index: 60;
  }

  /* Archive list */
  .empty {
    font-family: 'Times New Roman', 'PingFang TC', 'Songti TC', serif;
    font-style: italic;
    color: rgba(207, 228, 238, 0.4);
    text-align: center;
    margin-top: 80px;
    font-size: 17px;
  }
  .item {
    background: rgba(207, 228, 238, 0.04);
    border: 1px solid rgba(207, 228, 238, 0.08);
    border-radius: 16px;
    padding: 20px 22px;
    margin-bottom: 14px;
    transition: background 0.3s ease;
  }
  .item:hover { background: rgba(207, 228, 238, 0.07); }
  .item-date {
    font-family: 'Times New Roman', 'PingFang TC', 'Songti TC', serif;
    font-size: 12px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(207, 228, 238, 0.5);
    margin-bottom: 8px;
  }
  .item-text {
    font-family: 'PingFang TC', 'Songti TC', 'Times New Roman', serif;
    font-size: 16px;
    line-height: 1.85;
    color: var(--ink);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .item-actions { margin-top: 12px; display: flex; gap: 10px; }
  .small-link {
    background: rgba(207, 228, 238, 0.05);
    border: 1px solid rgba(207, 228, 238, 0.15);
    color: rgba(207, 228, 238, 0.7);
    font-family: -apple-system, 'PingFang TC', 'Helvetica Neue', sans-serif;
    font-size: 12px;
    letter-spacing: 0.15em;
    cursor: pointer;
    transition: all 0.3s ease;
    padding: 6px 14px;
    border-radius: 999px;
    font-weight: 300;
  }
  [data-lang="en"] .small-link {
    font-family: 'Times New Roman', 'PingFang TC', 'Songti TC', serif;
    font-style: italic;
    font-size: 13px;
    letter-spacing: 0.08em;
  }
  .small-link:hover {
    color: var(--foam);
    background: rgba(207, 228, 238, 0.1);
    border-color: rgba(207, 228, 238, 0.3);
  }

  /* Bubble */
  .bubble {
    position: fixed;
    z-index: 40;
    max-width: 320px;
    padding: 22px 24px;
    background: rgba(10, 31, 51, 0.9);
    border: 1px solid rgba(207, 228, 238, 0.22);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 18px;
    color: var(--ink);
    opacity: 0;
    transform: translateY(8px) scale(0.96);
    transition: opacity 0.35s ease, transform 0.35s ease;
    pointer-events: none;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }
  .bubble.show {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }
  .bubble .item-date { margin-bottom: 10px; }
  .bubble .item-text { font-size: 15px; }
  .bubble .item-actions { margin-top: 14px; }

  /* Settings */
  .setting-group {
    margin-bottom: 22px;
    padding: 22px;
    background: rgba(207, 228, 238, 0.04);
    border: 1px solid rgba(207, 228, 238, 0.08);
    border-radius: 16px;
  }
  .setting-label {
    font-family: -apple-system, 'PingFang TC', 'Helvetica Neue', sans-serif;
    font-size: 14px;
    color: var(--foam);
    opacity: 0.85;
    letter-spacing: 0.1em;
    margin-bottom: 14px;
    font-weight: 400;
  }
  [data-lang="en"] .setting-label {
    font-family: 'Times New Roman', 'PingFang TC', 'Songti TC', serif;
    font-style: italic;
    font-size: 16px;
    letter-spacing: 0.05em;
  }
  .setting-hint {
    font-family: 'Times New Roman', 'PingFang TC', 'Songti TC', serif;
    font-style: italic;
    font-size: 13px;
    color: rgba(207, 228, 238, 0.45);
    margin-top: 10px;
  }

  .segmented {
    display: flex;
    gap: 0;
    background: rgba(10, 31, 51, 0.4);
    border-radius: 999px;
    padding: 4px;
    border: 1px solid rgba(207, 228, 238, 0.12);
  }
  .segmented button {
    flex: 1;
    background: transparent;
    border: none;
    color: rgba(207, 228, 238, 0.55);
    font-family: -apple-system, 'PingFang TC', 'Helvetica Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 0.1em;
    padding: 10px 14px;
    cursor: pointer;
    border-radius: 999px;
    transition: all 0.3s ease;
    font-weight: 300;
  }
  .segmented button.active {
    background: var(--foam);
    color: var(--deep);
    font-weight: 400;
  }

  .name-input {
    width: 100%;
    background: rgba(10, 31, 51, 0.4);
    border: 1px solid rgba(207, 228, 238, 0.18);
    border-radius: 12px;
    color: var(--ink);
    font-family: 'PingFang TC', 'Songti TC', 'Times New Roman', serif;
    font-size: 16px;
    padding: 12px 16px;
    outline: none;
    transition: border-color 0.3s ease;
  }
  .name-input:focus { border-color: rgba(207, 228, 238, 0.4); }
  .name-input::placeholder {
    color: rgba(207, 228, 238, 0.35);
    font-family: -apple-system, 'PingFang TC', 'Helvetica Neue', sans-serif;
  }

  @media (max-width: 480px) {
    textarea.input { font-size: 17px; }
    .prompt { font-size: 16px; }
    .panel-title { font-size: 26px; }
    .stage { padding: 80px 22px 130px; }
  }
</style>
</head>
<body data-lang="zh">

<canvas id="sea"></canvas>
<div class="mist"></div>
<div class="lights-layer" id="lights"></div>

<div class="topbar">
  <div class="brand">drift</div>
  <div class="topbar-actions">
    <button class="icon-btn" id="settingsBtn" aria-label="settings" type="button"
      onclick="var p=document.getElementById('settings'); if(p){p.classList.add('open');} var n=document.getElementById('nameInput'); if(n&&window.prefs){n.value=window.prefs.name||'';} return false;"
      ontouchend="var p=document.getElementById('settings'); if(p){p.classList.add('open');}">
      <svg viewBox="0 0 24 24" style="pointer-events:none;"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</div>

<main class="stage">
  <div class="greeting" id="greeting">drift</div>
  <div class="prompt" id="prompt">寫下心裡那些不請自來的</div>
  <div class="compose">
    <textarea class="input" id="input" rows="4" placeholder="把它寫出來⋯⋯"></textarea>
    <div class="actions" id="actions">
      <button class="btn" id="releaseBtn" type="button" onclick="return window.doRelease && window.doRelease()">
        <span data-i18n="release">釋放</span>
        <span class="sub">release</span>
      </button>
      <button class="btn primary" id="keepBtn" type="button" onclick="return window.doKeep && window.doKeep()">
        <span data-i18n="keep">保留</span>
        <span class="sub">keep</span>
      </button>
    </div>
  </div>
</main>

<button class="archive-toggle" id="archiveOpen" onclick="window.openArchive && window.openArchive()">
  <span data-i18n="archive_toggle">保留的心念</span>
  <span class="count" id="keptCount"></span>
</button>

<!-- Archive -->
<div class="panel" id="archive">
  <button class="icon-btn panel-close" id="archiveClose" aria-label="close" type="button"
    onclick="document.getElementById('archive').classList.remove('open'); return false;">
    <svg viewBox="0 0 24 24" style="pointer-events:none;"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div class="panel-inner">
    <div class="panel-title" data-i18n="archive_title">保留的心念</div>
    <div class="panel-sub" data-i18n="archive_sub">海面上漂浮的</div>
    <div id="archiveList"></div>
  </div>
</div>

<!-- Settings -->
<div class="panel" id="settings">
  <button class="icon-btn panel-close" id="settingsClose" aria-label="close" type="button"
    onclick="document.getElementById('settings').classList.remove('open'); return false;">
    <svg viewBox="0 0 24 24" style="pointer-events:none;"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div class="panel-inner">
    <div class="panel-title" data-i18n="settings_title">設定</div>
    <div class="panel-sub" data-i18n="settings_sub">調整你的小空間</div>

    <div class="setting-group">
      <div class="setting-label" data-i18n="setting_name">你的名字</div>
      <input class="name-input" id="nameInput" maxlength="20" placeholder="想被叫什麼？" />
      <div class="setting-hint" data-i18n="setting_name_hint">資料儲存在你的裝置上</div>
    </div>

    <div class="setting-group">
      <div class="setting-label" data-i18n="setting_lang">語言</div>
      <div class="segmented" id="langSeg">
        <button data-val="zh" onclick="window.setLang && window.setLang('zh')">中文</button>
        <button data-val="en" onclick="window.setLang && window.setLang('en')">English</button>
      </div>
    </div>

    <div class="setting-group">
      <div class="setting-label" data-i18n="setting_sound">海浪聲</div>
      <div class="segmented" id="soundSeg">
        <button data-val="on" data-i18n="on" onclick="window.setSound && window.setSound('on')">開</button>
        <button data-val="off" data-i18n="off" onclick="window.setSound && window.setSound('off')">關</button>
      </div>
    </div>
  </div>
</div>

<div class="bubble" id="bubble"></div>

<script>
//// ---------- Silent error suppression (in-app browser noise) ----------
window.addEventListener('error', function(e) {

const PREFS_KEY = 'drift.prefs.v1';
function loadPrefs() {
  try {
    return Object.assign({ lang: 'zh', sound: 'off', name: '' },
      JSON.parse(localStorage.getItem(PREFS_KEY) || '{}'));
  } catch (e) {
    return { lang: 'zh', sound: 'off', name: '' };
  }
}
function savePrefs(p) { localStorage.setItem(PREFS_KEY, JSON.stringify(p)); }
let prefs = loadPrefs();
window.prefs = prefs;

function t(key) { return (I18N[prefs.lang] || I18N.zh)[key] || key; }

function applyLang() {
  try {
    document.body.setAttribute('data-lang', prefs.lang);
    document.documentElement.setAttribute('lang', prefs.lang === 'zh' ? 'zh-Hant' : 'en');
    document.title = t('title');
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      el.textContent = t(key);
    });
    var inputEl = document.getElementById('input');
    var nameEl = document.getElementById('nameInput');
    var promptEl = document.getElementById('prompt');
    if (inputEl) inputEl.setAttribute('placeholder', t('placeholder'));
    if (nameEl) nameEl.setAttribute('placeholder', t('name_placeholder'));
    if (promptEl) promptEl.textContent = t('prompt_default');
    updateGreeting();
    document.querySelectorAll('#langSeg button').forEach(b =>
      b.classList.toggle('active', b.dataset.val === prefs.lang));
    document.querySelectorAll('#soundSeg button').forEach(b =>
      b.classList.toggle('active', b.dataset.val === prefs.sound));
    var archiveEl = document.getElementById('archive');
    if (archiveEl && archiveEl.classList.contains('open')) renderArchive();
  } catch (err) {
    console.error('applyLang failed:', err);
  }
}

function updateGreeting() {
  const h = new Date().getHours();
  let key;
  if (h >= 5 && h < 12) key = 'greeting_morning';
  else if (h >= 12 && h < 18) key = 'greeting_afternoon';
  else if (h >= 18 && h < 23) key = 'greeting_evening';
  else key = 'greeting_night';
  const name = prefs.name ? `, ${prefs.name}` : '';
  document.getElementById('greeting').textContent = t(key) + name;
}

//// ---------- Sea Canvas + Wave math ----------
const canvas = document.getElementById('sea');
const ctx = canvas.getContext('2d');
let W, H, DPR;

const WAVE_LAYERS = [
  { yRatio: 0.48, amp: 9,  freq: 0.012, speed: 0.75, drift: 16, alpha: 0.08, stroke: 0.20, lineWidth: 1 },
  { yRatio: 0.60, amp: 13, freq: 0.010, speed: 0.95, drift: 24, alpha: 0.11, stroke: 0.24, lineWidth: 1 },
  { yRatio: 0.72, amp: 18, freq: 0.008, speed: 1.15, drift: 30, alpha: 0.14, stroke: 0.28, lineWidth: 1.2 },
  { yRatio: 0.84, amp: 24, freq: 0.006, speed: 1.35, drift: 40, alpha: 0.18, stroke: 0.32, lineWidth: 1.4 },
];

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
window.addEventListener('resize', () => { resize(); });

let waveTime = 0;
let lastWaveFrame = performance.now();

function waveY(x, layer, offset) {
  var phase = waveTime * layer.speed + (offset || 0);
  var driftingX = x + waveTime * layer.drift;
  return H * layer.yRatio
       + Math.sin(driftingX * layer.freq + phase) * layer.amp
       + Math.sin(driftingX * layer.freq * 1.9 - phase * 0.7) * layer.amp * 0.45
       + Math.sin(driftingX * layer.freq * 0.45 + phase * 0.35) * layer.amp * 0.25;
}

function drawWaveRibbon(layer, offset, fillAlpha, strokeAlpha) {
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 3) {
    ctx.lineTo(x, waveY(x, layer, offset));
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fillStyle = `rgba(207, 228, 238, ${fillAlpha})`;
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(0, waveY(0, layer, offset));
  for (let x = 3; x <= W; x += 3) {
    ctx.lineTo(x, waveY(x, layer, offset));
  }
  ctx.strokeStyle = `rgba(234, 243, 247, ${strokeAlpha})`;
  ctx.lineWidth = layer.lineWidth;
  ctx.stroke();
}

function drawSurfaceRipples() {
  var rippleCount = Math.max(7, Math.floor(H / 120));
  for (let i = 0; i < rippleCount; i++) {
    var yBase = H * (0.50 + i * 0.065);
    var width = W * (0.18 + (i % 3) * 0.09);
    var start = ((waveTime * (26 + i * 5)) + i * W * 0.19) % (W + width) - width;
    var alpha = 0.08 + i * 0.012;
    ctx.beginPath();
    for (let x = 0; x <= width; x += 6) {
      var px = start + x;
      var py = yBase
        + Math.sin((x * 0.035) + waveTime * (1.2 + i * 0.08)) * (3 + i * 0.35)
        + Math.sin((px * 0.018) - waveTime * 0.8) * 2;
      if (x === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    var gradient = ctx.createLinearGradient(start, 0, start + width, 0);
    gradient.addColorStop(0, 'rgba(234, 243, 247, 0)');
    gradient.addColorStop(0.5, `rgba(234, 243, 247, ${alpha})`);
    gradient.addColorStop(1, 'rgba(234, 243, 247, 0)');
    ctx.strokeStyle = gradient;
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

function drawSea(now) {
  var delta = Math.min((now - lastWaveFrame) / 1000, 0.05);
  lastWaveFrame = now;
  waveTime += delta;
  ctx.clearRect(0, 0, W, H);
  var glow = ctx.createLinearGradient(0, H * 0.42, 0, H);
  glow.addColorStop(0, 'rgba(207, 228, 238, 0)');
  glow.addColorStop(0.45, 'rgba(207, 228, 238, 0.035)');
  glow.addColorStop(1, 'rgba(207, 228, 238, 0.12)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, H * 0.42, W, H * 0.58);

  WAVE_LAYERS.forEach((L) => {
    drawWaveRibbon(L, 0, L.alpha, L.stroke);
    drawWaveRibbon(L, Math.PI * 0.72, L.alpha * 0.35, L.stroke * 0.45);
  });
  drawSurfaceRipples();
  updateLightsPosition();
  requestAnimationFrame(drawSea);
}
requestAnimationFrame(drawSea);

function fmtDate(ts) {
  const d = new Date(ts);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  return `${y}.${m}.${day} · ${hh}:${mm}`;
}

//// ---------- Floating lights (synced with waves) ----------
const lightsLayer = document.getElementById('lights');
const lightEls = new Map(); // id -> { el, baseXPct, layerIdx, phase }

function lightAnchorFor(item) {
  // deterministic hash -> stable position per id
  var h = 0;
  for (var i = 0; i < item.id.length; i++) {
    h = ((h << 5) - h + item.id.charCodeAt(i)) | 0;
  }
  var ah = Math.abs(h);
  var r1 = (ah % 10000) / 10000;
  var r2 = (Math.floor(ah / 10000) % 10000) / 10000;
  var r3 = (Math.floor(ah / 100000000) % 10000) / 10000;
  var baseXPct = 10 + r1 * 80;
  var layerIdx = Math.floor(r2 * WAVE_LAYERS.length);
  if (layerIdx >= WAVE_LAYERS.length) layerIdx = WAVE_LAYERS.length - 1;
  var phase = r3 * Math.PI * 2;
  return { baseXPct: baseXPct, layerIdx: layerIdx, phase: phase };
}

function renderLights() {
  try {
    // remove stale
    var staleIds = [];
    lightEls.forEach(function(info, id) {
      var found = false;
      for (var i = 0; i < kept.length; i++) {
        if (kept[i].id === id) { found = true; break; }
      }
      if (!found) staleIds.push(id);
    });
    staleIds.forEach(function(id) {
      var info = lightEls.get(id);
      if (info && info.el) info.el.remove();
      lightEls.delete(id);
    });
    // add new
    kept.forEach(function(item) {
      if (!lightEls.has(item.id)) {
        var a = lightAnchorFor(item);
        var el = document.createElement('div');
        el.className = 'light';
        el.dataset.id = item.id;
        el.addEventListener('click', function(e) {
          e.stopPropagation();
          openBubble(item, el);
        });
        lightsLayer.appendChild(el);
        lightEls.set(item.id, {
          el: el,
          baseXPct: a.baseXPct,
          layerIdx: a.layerIdx,
          phase: a.phase
        });
      }
    });
    var countEl = document.getElementById('keptCount');
    if (countEl) countEl.textContent = kept.length ? '( ' + kept.length + ' )' : '';
    updateLightsPosition();
  } catch (err) {
    console.error('renderLights failed:', err);
  }
}

function updateLightsPosition() {
  if (!lightEls.size || !W) return;
  lightEls.forEach(function(info) {
    var x = W * info.baseXPct / 100;
    var layer = WAVE_LAYERS[info.layerIdx];
    var bob = Math.sin(waveTime * 0.015 + info.phase) * 4;
    var y = waveY(x, layer) - 12 + bob;
    info.el.style.left = x + 'px';
    info.el.style.top = y + 'px';
  });
}

//// ---------- Bubble ----------
const bubble = document.getElementById('bubble');

function openBubble(item, anchor) {
  const rect = anchor.getBoundingClientRect();
  bubble.innerHTML = `
    <div class="item-date">${fmtDate(item.ts)}</div>
    <div class="item-text">${escapeHTML(item.text)}</div>
    <div class="item-actions">
      <button class="small-link" data-act="release">${t('bubble_release')}</button>
      <button class="small-link" data-act="close">${t('bubble_close')}</button>
    </div>
  `;
  bubble.classList.add('show');
  const bw = 320;
  let left = rect.left + rect.width / 2 - bw / 2;
  left = Math.max(16, Math.min(window.innerWidth - bw - 16, left));
  let top = rect.top - 12;
  bubble.style.left = left + 'px';
  bubble.style.bottom = (window.innerHeight - top) + 'px';
  bubble.style.top = 'auto';
  bubble.querySelectorAll('.small-link').forEach(b => {
    b.addEventListener('click', () => {
      const act = b.dataset.act;
      if (act === 'close') closeBubble();
      if (act === 'release') releaseKept(item.id);
    });
  });
}
function closeBubble() { bubble.classList.remove('show'); }
document.addEventListener('click', (e) => {
  if (!bubble.contains(e.target) && !e.target.classList.contains('light')) {
    closeBubble();
  }
});

function escapeHTML(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function syncComposeState() {

  prompt.style.opacity = hasText ? 0 : 0.6;

['input', 'change', 'keyup', 'compositionend', 'focus', 'blur'].forEach(function(eventName) {
  input.addEventListener(eventName, syncComposeState);
});
syncComposeState();

//// ---------- Animations ----------
function runElementAnimation(el, keyframes, options, onFinish) {
  if (typeof el.animate === 'function') {
    var animation = el.animate(keyframes, options);
    animation.onfinish = onFinish;
    return;
  }
  var lastFrame = keyframes[keyframes.length - 1];
  Object.keys(lastFrame).forEach(function(prop) {
    if (prop !== 'offset') el.style[prop] = lastFrame[prop];
  });
  setTimeout(onFinish, options.duration || 1000);
}

function releaseAnimation(text) {
  const el = document.createElement('div');
  el.className = 'drifting';
  el.textContent = text;
  const rect = input.getBoundingClientRect();
  el.style.left = rect.left + 'px';
  el.style.top = rect.top + 'px';
  el.style.width = rect.width + 'px';
  document.body.appendChild(el);
  const driftX = (Math.random() - 0.5) * 120;
  const driftY = -window.innerHeight * 0.65;
  const rot = (Math.random() - 0.5) * 6;
  runElementAnimation(el, [
    { transform: 'translate(0, 0) scale(1)', opacity: 1, filter: 'blur(0px)' },
    { transform: `translate(${driftX*0.4}px, ${driftY*0.4}px) scale(0.85)`,
      opacity: 0.7, filter: 'blur(1px)', offset: 0.5 },
    { transform: `translate(${driftX}px, ${driftY}px) scale(0.5) rotate(${rot}deg)`,
      opacity: 0, filter: 'blur(8px)' }
  ], {
    duration: 6500,
    easing: 'cubic-bezier(0.22, 0.61, 0.36, 1)',
    fill: 'forwards'
  }, () => el.remove());
}

function keepAnimation(text, lightId) {
  const el = document.createElement('div');
  el.className = 'drifting';
  el.textContent = text;
  const rect = input.getBoundingClientRect();
  el.style.left = rect.left + 'px';
  el.style.top = rect.top + 'px';
  el.style.width = rect.width + 'px';
  document.body.appendChild(el);

  const info = lightEls.get(lightId);
  let targetX = 0, targetY = window.innerHeight * 0.7 - rect.top;
  if (info) {
    const lightRect = info.el.getBoundingClientRect();
    targetX = lightRect.left + lightRect.width / 2 - (rect.left + rect.width / 2);
    targetY = lightRect.top + lightRect.height / 2 - (rect.top + 20);
  }

  runElementAnimation(el, [
    { transform: 'translate(0,0) scale(1)', opacity: 1, filter: 'blur(0)' },
    { transform: `translate(${targetX*0.6}px, ${targetY*0.6}px) scale(0.4)`,
      opacity: 0.6, filter: 'blur(1px)', offset: 0.7 },
    { transform: `translate(${targetX}px, ${targetY}px) scale(0.05)`,
      opacity: 0, filter: 'blur(2px)' }
  ], {
    duration: 2200,
    easing: 'cubic-bezier(0.4, 0, 0.2, 1)',
    fill: 'forwards'
  }, () => el.remove());
}

//// ---------- Archive panel ----------
const archive = document.getElementById('archive');
const archiveList = document.getElementById('archiveList');

function renderArchive() {
  if (!kept.length) {
    archiveList.innerHTML = `<div class="empty">${t('archive_empty')}</div>`;
    return;
  }
  archiveList.innerHTML = kept.map(item => `
    <div class="item" data-id="${item.id}">
      <div class="item-date">${fmtDate(item.ts)}</div>
      <div class="item-text">${escapeHTML(item.text)}</div>
      <div class="item-actions">
        <button class="small-link" data-act="release">${t('bubble_release')}</button>
      </div>
    </div>
  `).join('');
  archiveList.querySelectorAll('.small-link').forEach(b => {
    b.addEventListener('click', (e) => {
      const id = e.target.closest('.item').dataset.id;
      releaseKept(id);
    });
  });
}

// Archive open/close are handled via inline onclick -> window.openArchive / window.closeArchive.

function releaseKept(id) {
  const item = kept.find(k => k.id === id);
  if (!item) return;
  kept = kept.filter(k => k.id !== id);
  saveKept(kept);
  renderLights();
  if (archive.classList.contains('open')) renderArchive();
  closeBubble();
  const ghost = document.createElement('div');
  ghost.className = 'drifting';
  ghost.textContent = item.text;
  ghost.style.left = '50%';
  ghost.style.top = '50%';
  ghost.style.transform = 'translate(-50%, -50%)';
  ghost.style.width = 'min(480px, 80vw)';
  document.body.appendChild(ghost);
  runElementAnimation(ghost, [
    { opacity: 1, filter: 'blur(0)', transform: 'translate(-50%, -50%) scale(1)' },
    { opacity: 0, filter: 'blur(10px)', transform: 'translate(-50%, -180%) scale(0.6)' }
  ], { duration: 4500, easing: 'ease-out', fill: 'forwards' }, () => ghost.remove());
}

// Release / Keep (forwarded to existing logic)
window.doRelease = function() {
  try {
    var text = input.value.trim();
    if (!text) return false;
    releaseAnimation(text);
    input.value = '';
    syncComposeState();
    return false;
  } catch (e) { try { console.error(e); } catch(_){} }
  return false;
};

window.doKeep = function() {
  try {
    var text = input.value.trim();
    if (!text) return false;
    var item = {
      id: 'k' + Date.now() + Math.random().toString(36).slice(2, 6),
      text: text,
      ts: Date.now()
    };
    kept.unshift(item);
    saveKept(kept);
    renderLights();
    updateLightsPosition();
    var info = lightEls.get(item.id);
    if (info) {
      info.el.classList.add('new');
      setTimeout(function() { info.el.classList.remove('new'); }, 1400);
    }
    keepAnimation(text, item.id);
    input.value = '';
    syncComposeState();
    return false;
  } catch (e) { try { console.error(e); } catch(_){} }
  return false;
};

function bindActionButton(id, handler) {
  var button = document.getElementById(id);
  if (!button) return;
  var lastRun = 0;
  var run = function(e) {
    if (e && e.cancelable) e.preventDefault();
    if (e) e.stopPropagation();
    var now = Date.now();
    if (now - lastRun < 350) return false;
    lastRun = now;
    syncComposeState();
    handler();
    return false;
  };
  button.addEventListener('click', run);
  button.addEventListener('touchend', run, { passive: false });
}

safe(function() {
  bindActionButton('releaseBtn', window.doRelease);
  bindActionButton('keepBtn', window.doKeep);
});

// Name input is just an input event - bind via addEventListener (the field always exists)
function safe(fn) { try { fn(); } catch (e) { try { console.error(e); } catch(_){} } }
safe(function() {
  document.getElementById('nameInput').addEventListener('input', function(e) {
    prefs.name = e.target.value.trim();
    savePrefs(prefs);
    updateGreeting();
  });
});

//// ---------- Sound ----------
let audioCtx = null, noiseNode = null, lfo = null, masterGain = null;

function startOcean() {
  if (audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AC();
  const bufferSize = 2 * audioCtx.sampleRate;
  const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const output = noiseBuffer.getChannelData(0);
  let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for (let i = 0; i < bufferSize; i++) {
    const white = Math.random()*2 - 1;
    b0 = 0.99886*b0 + white*0.0555179;
    b1 = 0.99332*b1 + white*0.0750759;
    b2 = 0.96900*b2 + white*0.1538520;
    b3 = 0.86650*b3 + white*0.3104856;
    b4 = 0.55000*b4 + white*0.5329522;
    b5 = -0.7616*b5 - white*0.0168980;
    output[i] = (b0+b1+b2+b3+b4+b5+b6+white*0.5362) * 0.11;
    b6 = white*0.115926;
  }
  noiseNode = audioCtx.createBufferSource();
  noiseNode.buffer = noiseBuffer;
  noiseNode.loop = true;
  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 900;
  lp.Q.value = 0.6;
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0;
  const lfoOsc = audioCtx.createOscillator();
  lfoOsc.frequency.value = 0.12;
  const lfoGain = audioCtx.createGain();
  lfoGain.gain.value = 0.18;
  lfoOsc.connect(lfoGain).connect(masterGain.gain);
  noiseNode.connect(lp).connect(masterGain).connect(audioCtx.destination);
  noiseNode.start();
  lfoOsc.start();
  lfo = lfoOsc;
  const now = audioCtx.currentTime;
  masterGain.gain.cancelScheduledValues(now);
  masterGain.gain.setValueAtTime(0, now);
  masterGain.gain.linearRampToValueAtTime(0.35, now + 2.0);
}

function stopOcean() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  masterGain.gain.cancelScheduledValues(now);
  masterGain.gain.setValueAtTime(masterGain.gain.value, now);
  masterGain.gain.linearRampToValueAtTime(0, now + 1.0);
  const c = audioCtx, n = noiseNode, l = lfo;
  audioCtx = null; noiseNode = null; lfo = null; masterGain = null;
  setTimeout(() => { try { n.stop(); l.stop(); c.close(); } catch(e){} }, 1100);
}

//// ---------- Init ----------
try {
  applyLang();
  renderLights();
  if (prefs.sound === 'on') {
    var trigger = function() {
      startOcean();
      document.removeEventListener('click', trigger);
      document.removeEventListener('touchstart', trigger);
    };
    document.addEventListener('click', trigger, { once: true });
    document.addEventListener('touchstart', trigger, { once: true });
  }
} catch (err) {
  try { console.error('Init failed:', err); } catch(_){}
  var p = document.getElementById('prompt');
  var i = document.getElementById('input');
  if (p && !p.textContent) p.textContent = '寫下心裡那些不請自來的';
  if (i && !i.getAttribute('placeholder')) i.setAttribute('placeholder', '把它寫出來⋯⋯');
}
